# Cross-platform CI for wezterminator (plan U17).
#
# - macOS and Linux: Rust workspace tests (including art goldens and shared
#   resolution fixtures) plus the stock-Lua harness (same fixtures both sides).
# - Windows: build only (full Windows probe/chrome parity is deferred).

name: ci

on:
  push:
    branches: [main, master, "feat/**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  # Never launch a GUI browser from cargo test / CI.
  WZT_NO_OPEN: "1"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace

      - name: Install Lua (stock harness)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Install Lua (stock harness)
        if: runner.os == 'macOS'
        run: brew install lua

      - name: Rust tests (fixtures + goldens)
        run: cargo test --workspace --locked

      - name: Lua harness (shared fixtures)
        run: |
          if command -v lua5.4 >/dev/null 2>&1; then
            lua5.4 tests/lua/run.lua
          else
            lua tests/lua/run.lua
          fi

  windows-build:
    name: build (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-windows

      - name: Build workspace
        run: cargo build --workspace --locked
