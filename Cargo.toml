[workspace]
resolver = "3"
members = ["crates/wzt-model", "crates/wzt-stats", "crates/wezterminator"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
etcetera = "0.11"
serde = { version = "1", features = ["derive"] }
# preserve_order keeps object key order stable through read and write, so
# hand-edited files diff cleanly after the TUI rewrites them.
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
thiserror = "2"

wzt-model = { path = "crates/wzt-model" }
wzt-stats = { path = "crates/wzt-stats" }

[workspace.lints.rust]
unsafe_code = "forbid"
